name: Android 11 Compatibility Diagnostic

on:
  repository_dispatch:
    types: [android11-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.6'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Compile cloudflared for Android
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Build GMS debug APK with diagnostic log
        shell: bash
        run: |
          set +e
          ./gradlew assembleGmsDebug --stacktrace --info 2>&1 | tee build-diagnostic.log
          rc=${PIPESTATUS[0]}
          echo "GRADLE_EXIT_CODE=$rc" >> build-diagnostic.log
          exit $rc

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android11-build-diagnostic
          path: |
            build-diagnostic.log
            app/build/outputs/logs/**
            app/build/outputs/apk/gms/debug/**
          retention-days: 7
