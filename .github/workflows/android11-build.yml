name: Android 11 Compatibility Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.6'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Compile cloudflared for Android
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Build GMS debug APK
        run: ./gradlew assembleGmsDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-11-compat-gms-debug
          path: app/build/outputs/apk/gms/debug/app-gms-debug.apk
          retention-days: 7
